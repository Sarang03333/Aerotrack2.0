<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="mb-3">Sign in</h4>

        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control" formControlName="username" placeholder="admin | maint | inv | comp">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" formControlName="password" placeholder="P@ssw0rd!">
          </div>

          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" formControlName="remember" id="remember">
            <label class="form-check-label" for="remember">Remember me</label>
          </div>

          <button class="btn btn-primary w-100" [disabled]="loading" type="submit">
            {{ loading ? 'Signing in…' : 'Sign in' }}
          </button>
        </form>

        <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
      </div>
    </div>
  </div>
</div>
