<h2 class="mb-3">Reports & Exports</h2>
<div class="row g-3">
  <div class="col-md-3">
    <div class="card">
      <div class="card-body">
        <h6>Aircraft</h6>
        <button class="btn btn-sm btn-primary" (click)="exportAircraft()">
          Export CSV
        </button>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card">
      <div class="card-body">
        <h6>Maintenance</h6>
        <button class="btn btn-sm btn-primary" (click)="exportTasks()">
          Export CSV
        </button>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card">
      <div class="card-body">
        <h6>Inventory</h6>
        <button class="btn btn-sm btn-primary" (click)="exportParts()">
          Export CSV
        </button>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card">
      <div class="card-body">
        <h6>Compliance</h6>
        <button class="btn btn-sm btn-primary" (click)="exportAudits()">
          Export CSV
        </button>
      </div>
    </div>
  </div>
</div>
