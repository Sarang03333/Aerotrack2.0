<h4 class="text-white mb-3 fw-bold">Maintenance Ops</h4>
<div class="row g-3">
  <div class="col-md-4">
    <div class="card h-100 shadow-sm border-secondary" style="background-color: #1e293b;">
      <div class="card-header border-secondary text-white small text-uppercase fw-bold">Task Status</div>
      <div class="card-body" style="height: 250px; position: relative;">
        <canvas baseChart [data]="statusData" type="doughnut" [options]="pieOptions"></canvas>
      </div>
    </div>
  </div>

  <div class="col-md-8">
    <div class="card h-100 shadow-sm border-secondary" style="background-color: #1e293b;">
      <div class="card-header border-secondary text-white small text-uppercase fw-bold">Workload (Next 7 Days)</div>
      <div class="card-body" style="height: 250px; position: relative;">
        <canvas baseChart [data]="tasksPerDayData" type="line" [options]="darkOptions"></canvas>
      </div>
    </div>
  </div>

  <div class="col-12">
    <div class="card shadow-sm border-secondary" style="background-color: #1e293b;">
      <div class="card-header border-secondary text-white small text-uppercase fw-bold">Top 5 Aircraft by Volume</div>
      <div class="card-body" style="height: 220px; position: relative;">
        <canvas baseChart [data]="topAircraftData" type="bar" [options]="darkOptions"></canvas>
      </div>
    </div>
  </div>
</div>
