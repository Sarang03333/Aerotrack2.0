<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0 text-muted">Aircraft</h2>
  <div class="d-flex gap-2">
    <a class="btn btn-sm btn-outline-primary" routerLink="/aircraft/dashboard"><i class="bi bi-graph-up me-1"></i> Dashboard</a>
    <a class="btn btn-sm btn-primary" routerLink="/aircraft/new">+ Add Aircraft</a>
  </div>
</div>
<div class="input-group mb-3">
  <span class="input-group-text">Search</span>
  <input class="form-control" [(ngModel)]="term" placeholder="ID / Model / Category" />
</div>
<div class="table-responsive">
<table class="table table-striped table-dark table-hover align-middle">
  <thead><tr><th>ID</th><th>Model</th><th>Category</th><th>Last Service Date</th><th>Compliance</th><th class="text-end">Actions</th></tr></thead>
  <tbody>
    <tr *ngFor="let a of (aircraft$|async) | search:term:['aircraftId','model','category']">
      <td>{{a.aircraftId}}</td>
      <td>{{a.model}}</td>
      <td><span class="badge bg-info">{{a.category}}</span></td>
      <td>{{ a.lastServiceDate | date }}</td>
      <td>
        <span class="badge" [ngClass]="{'bg-success': a.complianceStatus==='Compliant','bg-warning text-dark': a.complianceStatus==='Pending','bg-danger': a.complianceStatus==='Non-Compliant'}">{{a.complianceStatus}}</span>
      </td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-secondary me-2" [routerLink]="['/aircraft/edit', a.aircraftId]">Edit</a>
        <button class="btn btn-sm btn-outline-danger" (click)="remove(a.aircraftId)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>
</div>
