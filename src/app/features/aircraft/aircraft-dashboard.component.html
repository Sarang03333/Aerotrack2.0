<h4 class="text-white mb-3 fw-bold">Aircraft Overview</h4>
<div class="row g-3">
  <div class="col-md-6">
    <div class="card h-100 shadow-sm border-secondary" style="background-color: #1e293b;">
      <div class="card-header border-secondary text-white small text-uppercase fw-bold">Fleet Category</div>
      <div class="card-body" style="height: 250px; position: relative;">
        <canvas baseChart [data]="categoryData" type="doughnut" [options]="pieOptions"></canvas>
      </div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="card h-100 shadow-sm border-secondary" style="background-color: #1e293b;">
      <div class="card-header border-secondary text-white small text-uppercase fw-bold">Compliance Health</div>
      <div class="card-body" style="height: 250px; position: relative;">
        <canvas baseChart [data]="complianceData" type="pie" [options]="pieOptions"></canvas>
      </div>
    </div>
  </div>

  <div class="col-12">
    <div class="card shadow-sm border-secondary" style="background-color: #1e293b;">
      <div class="card-header border-secondary text-white small text-uppercase fw-bold">Service Events Trend</div>
      <div class="card-body" style="height: 250px; position: relative;">
        <canvas baseChart [data]="servicesByMonthData" type="bar" [options]="darkOptions"></canvas>
      </div>
    </div>
  </div>
</div>
