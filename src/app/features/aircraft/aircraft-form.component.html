<div class="row justify-content-center">
  <div class="col-md-10 col-lg-8">
    <div class="form-card fade-in">
      
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="text-white fw-bold mb-0">
          <i class="bi bi-airplane-engines me-2 text-primary"></i>
          {{ mode === 'new' ? 'Register Aircraft' : 'Edit Aircraft' }}
        </h4>
        <span class="badge bg-primary bg-opacity-25 text-primary border border-primary">
          {{ mode === 'new' ? 'New Entry' : id }}
        </span>
      </div>

      <div class="alert alert-dark border-secondary d-flex align-items-center mb-4" role="alert">
        <i class="bi bi-info-circle-fill text-info me-3 fs-4"></i>
        <div>
          <small class="text-secondary text-uppercase fw-bold d-block">Compliance Status</small>
          <span class="text-white">
            Auto-computed from audits:
            <span class="badge bg-success ms-2" *ngIf="computedStatus==='Compliant'">Compliant</span>
            <span class="badge bg-warning text-dark ms-2" *ngIf="computedStatus==='Pending'">Pending</span>
            <span class="badge bg-danger ms-2" *ngIf="computedStatus==='Non-Compliant'">Non‑Compliant</span>
            <span class="badge bg-secondary ms-2" *ngIf="!computedStatus">Unknown</span>
          </span>
        </div>
      </div>

      <form [formGroup]="form" (ngSubmit)="save()" class="row g-3">
        
        <div class="col-md-4">
          <label class="form-label">Aircraft ID</label>
          <input class="form-control" formControlName="aircraftId" 
                 [readonly]="mode==='edit'" 
                 placeholder="e.g. AC-COM-0001">
        </div>

        <div class="col-md-4">
          <label class="form-label">Model</label>
          <input class="form-control" formControlName="model" 
                 placeholder="e.g. Boeing 737-800">
        </div>

        <div class="col-md-4">
          <label class="form-label">Category</label>
          <select class="form-select" formControlName="category">
            <option value="" disabled selected>Select Category</option>
            <option>Commercial</option>
            <option>Defense</option>
            <option>Cargo</option>
          </select>
        </div>

        <div class="col-12 mt-4 d-flex justify-content-end gap-2">
          <a routerLink="/aircraft" class="btn btn-outline-secondary">Cancel</a>
          <button class="btn btn-primary px-4" type="submit" [disabled]="form.invalid">
            <i class="bi bi-save me-2"></i>{{ mode === 'new' ? 'Save Aircraft' : 'Update Changes' }}
          </button>
        </div>

      </form>

    </div>
  </div>
</div>
