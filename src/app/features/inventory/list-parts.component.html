<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0 text-muted">Inventory</h2>
  <div class="d-flex gap-2">
    <a class="btn btn-sm btn-outline-primary" routerLink="/inventory/dashboard"><i class="bi bi-graph-up me-1"></i> Dashboard</a>
    <a class="btn btn-sm btn-primary" routerLink="/inventory/new">+ Add Part</a>
  </div>
</div>
<div class="input-group mb-3">
  <span class="input-group-text">Search</span>
  <input class="form-control" [(ngModel)]="term" placeholder="Part / Name" />
</div>
<div class="table-responsive">
<table class="table table-striped table-dark table-hover align-middle">
  <thead><tr><th>Part ID</th><th>Name</th><th>Qty</th><th>Reorder</th><th>Last Updated</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
  <tbody>
    <tr *ngFor="let p of (parts$ | async) | search:term:['partId','name']">
      <td>{{p.partId}}</td>
      <td>{{p.name}}</td>
      <td>{{p.quantityAvailable}}</td>
      <td>{{p.reorderLevel}}</td>
      <td>{{p.lastUpdated | date}}</td>
      <td>
        <span class="badge" [ngClass]="{'bg-danger': p.quantityAvailable <= p.reorderLevel, 'bg-success': p.quantityAvailable > p.reorderLevel}">{{p.quantityAvailable <= p.reorderLevel ? 'Low' : 'OK'}}</span>
      </td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-secondary me-2" [routerLink]="['/inventory/edit', p.partId]">Edit</a>
        <button class="btn btn-sm btn-warning me-2" (click)="replenish(p.partId)" [disabled]="p.quantityAvailable > p.reorderLevel">Replenish</button>
        <button class="btn btn-sm btn-outline-danger" (click)="remove(p.partId)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>
</div>
