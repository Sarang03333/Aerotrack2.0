<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="form-card fade-in">

      <h4 class="text-white fw-bold mb-4">
        <i class="bi bi-box-seam me-2 text-success"></i>
        {{ mode === 'new' ? 'Add Inventory Item' : 'Edit Part Details' }}
      </h4>

      <div *ngIf="errorMessage" class="alert alert-danger border-start border-4 border-danger fade show mb-4">
        <i class="bi bi-exclamation-octagon-fill me-2"></i>
        <strong>Validation Error:</strong> {{ errorMessage }}
      </div>

      <form [formGroup]="form" (ngSubmit)="save()" class="row g-3">
        
        <div class="col-12">
          <label class="form-label">Part ID</label>
          <input class="form-control" formControlName="partId" 
                 [readonly]="mode === 'edit'" 
                 [class.is-invalid]="form.get('partId')?.invalid && form.get('partId')?.touched"
                 placeholder="e.g. SP-123">
          <div class="invalid-feedback">Format: SP-XXX (e.g., SP-123)</div>
        </div>
        <div class="col-12">
          <label class="form-label">Part Name</label>
          <input class="form-control" formControlName="name" 
                 [class.is-invalid]="form.get('name')?.invalid && form.get('name')?.touched"
                 placeholder="e.g. Turbine Blade Level 1">
        </div>

        <div class="col-md-6">
          <label class="form-label">Quantity On Hand</label>
          <input type="number" class="form-control" formControlName="quantityAvailable" 
                 [class.is-invalid]="form.get('quantityAvailable')?.invalid && form.get('quantityAvailable')?.touched">
        </div>

        <div class="col-md-6">
          <label class="form-label">Reorder Level</label>
          <input type="number" class="form-control" formControlName="reorderLevel" 
                 [class.is-invalid]="form.get('reorderLevel')?.invalid && form.get('reorderLevel')?.touched">
        </div>

        <div class="col-12 mt-4 d-flex justify-content-end gap-2">
          <a routerLink="/inventory" class="btn btn-outline-secondary">Cancel</a>
          <button class="btn btn-primary px-4" type="submit" [disabled]="form.invalid">
            <i class="bi bi-box-arrow-in-down me-2"></i>{{ mode === 'new' ? 'Add to Stock' : 'Update Item' }}
          </button>
        </div>

      </form>

    </div>
  </div>
</div>
