<h4 class="text-white mb-3 fw-bold">Compliance Status</h4>
<div class="row g-3">
  <div class="col-md-6">
    <div class="card h-100 shadow-sm border-secondary" style="background-color: #1e293b;">
      <div class="card-header border-secondary text-white small text-uppercase fw-bold">Fleet Compliance</div>
      <div class="card-body" style="height: 280px; position: relative;">
        <canvas baseChart [data]="complianceData" type="doughnut" [options]="pieOptions"></canvas>
      </div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="card h-100 shadow-sm border-secondary" style="background-color: #1e293b;">
      <div class="card-header border-secondary text-white small text-uppercase fw-bold">Audit Frequency</div>
      <div class="card-body" style="height: 280px; position: relative;">
        <canvas baseChart [data]="auditsByMonthData" type="bar" [options]="darkOptions"></canvas>
      </div>
    </div>
  </div>
</div>
