<h2 class="mb-3">Compliance Dashboard</h2>
<div class="row g-3">
  <div class="col-lg-6">
    <div class="card"><div class="card-body"><h6>Compliance Status</h6>
      <canvas baseChart [data]="complianceData" chartType="doughnut"></canvas>
    </div></div>
  </div>
  <div class="col-lg-6">
    <div class="card"><div class="card-body"><h6>Audits by Month</h6>
      <canvas baseChart [data]="auditsByMonthData" chartType="bar"></canvas>
    </div></div>
  </div>
</div>
